services:
  postgres:
    image: postgres:14-alpine
    container_name: notifications-postgres
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notifications-network

  redis:
    image: redis:7-alpine
    container_name: notifications-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notifications-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notifications-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # CORS allowed origins (comma-separated list)
      # Example: "http://localhost,http://localhost:80,https://yourdomain.com"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:4200,http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - notifications-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notifications-frontend
    ports:
      - "80:80"
    environment:
      # API_URL: Base URL of the backend API (accessible from the browser)
      # The script will automatically append /admin and /api/notifications
      API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - notifications-network

networks:
  notifications-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
