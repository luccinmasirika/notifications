<div class="card">
  <div class="card-header">
    <h2 class="card-title">Admin</h2>
    <button mat-raised-button color="primary" (click)="openAddClientDialog()">
      <mat-icon>add</mat-icon>
      Add Client
    </button>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <table mat-table [dataSource]="clients" *ngIf="!loading" class="mat-elevation-z0">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let client">{{ client.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let client">{{ client.name }}</td>
    </ng-container>

    <ng-container matColumnDef="apiKey">
      <th mat-header-cell *matHeaderCellDef>API Key</th>
      <td mat-cell *matCellDef="let client">
        <code class="api-key-code">{{ client.apiKey }}</code>
      </td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef>Priority</th>
      <td mat-cell *matCellDef="let client">{{ client.priority }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let client">
        <mat-chip [class.status-active]="client.active" [class.status-inactive]="!client.active">
          {{ client.active ? 'Active' : 'Inactive' }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let client">{{ formatDate(client.createdAt) }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let client">
        <button mat-icon-button color="primary" (click)="openDetailsDialog(client)" title="View Details">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="primary" (click)="openEditClientDialog(client)" title="Edit Client">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="openLimitsDialog(client)" title="Edit Limits">
          <mat-icon>settings</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="!loading && clients.length === 0" class="empty-state-container">
    <mat-icon class="empty-state-icon">inbox</mat-icon>
    <p>No clients found. Click "Add Client" to create one.</p>
  </div>
</div>
