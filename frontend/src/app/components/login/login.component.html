  <div class="login-container">
    <div class="login-header">
      <div class="logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="var(--primary)"
          class="logo-image"
          viewBox="0 0 91 25"
        >

            clip-rule="evenodd"
          />
        </svg>
      </div>
      <p class="subtitle">{{ 'login.subtitle' | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'login.emailOrUsername' | translate }}</mat-label>
        <input
          matInput
          formControlName="username"
          [placeholder]="'login.emailPlaceholder' | translate"
          autocomplete="username"
          type="text"
        />
        <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
          {{ 'login.usernameRequired' | translate }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'login.password' | translate }}</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          [placeholder]="'login.passwordPlaceholder' | translate"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="'login.togglePasswordVisibility' | translate"
        >
          <mat-icon>{{
            hidePassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          {{ 'login.passwordRequired' | translate }}
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="login-button full-width"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="!loading">{{ 'login.signIn' | translate }}</span>
        <span *ngIf="loading" class="loading-content">
          <mat-spinner diameter="20"></mat-spinner>
          <span>{{ 'login.signingIn' | translate }}</span>
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>{{ 'login.needHelp' | translate }} <a href="https://irembo.com/about/" target="_blank" rel="noopener noreferrer" class="link">{{ 'login.contactSupport' | translate }}</a></p>
    </div>
  </div>
</div>
