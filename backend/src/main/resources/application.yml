spring:
  application:
    name: notifications-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:1310}
  error:
    include-message: always

logging:
  level:
    com.irembo.notifications: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

app:
  crypto:
    master-key: ${APP_CRYPTO_MASTER_KEY:}
  auth:
    timestamp-window-ms: ${APP_AUTH_TIMESTAMP_WINDOW_MS:120000}
  notification:
    delay:
      min-ms: ${APP_NOTIFICATION_DELAY_MIN_MS:1000}
      max-ms: ${APP_NOTIFICATION_DELAY_MAX_MS:3000}
  rate-limiter:
    jitter:
      min-ms: ${APP_RATE_LIMITER_JITTER_MIN_MS:50}
      max-ms: ${APP_RATE_LIMITER_JITTER_MAX_MS:200}
    thresholds:
      soft-throttle: ${APP_RATE_LIMITER_SOFT_THROTTLE_THRESHOLD:0.80}
      hard-reject: ${APP_RATE_LIMITER_HARD_REJECT_THRESHOLD:1.00}
    invalid-api-key-retry-delay-seconds: ${APP_RATE_LIMITER_INVALID_API_KEY_RETRY_DELAY_SECONDS:60}
  default-client-limits:
    window-size-seconds: ${APP_DEFAULT_CLIENT_LIMITS_WINDOW_SIZE_SECONDS:60}
    max-requests-per-window: ${APP_DEFAULT_CLIENT_LIMITS_MAX_REQUESTS_PER_WINDOW:100}
    monthly-quota: ${APP_DEFAULT_CLIENT_LIMITS_MONTHLY_QUOTA:10000}
    soft-throttle-threshold: ${APP_DEFAULT_CLIENT_LIMITS_SOFT_THROTTLE_THRESHOLD:0.80}
    hard-reject-threshold: ${APP_DEFAULT_CLIENT_LIMITS_HARD_REJECT_THRESHOLD:1.00}
  admin-rate-limiter:
    window-seconds: ${APP_ADMIN_RATE_LIMITER_WINDOW_SECONDS:300}
    max-requests: ${APP_ADMIN_RATE_LIMITER_MAX_REQUESTS:100}
  cache:
    api-key-validation-ttl-hours: ${APP_CACHE_API_KEY_VALIDATION_TTL_HOURS:24}
    default-ttl-minutes: ${APP_CACHE_DEFAULT_TTL_MINUTES:5}
    caffeine-max-size: ${APP_CACHE_CAFFEINE_MAX_SIZE:500}
  pagination:
    default-size: ${APP_PAGINATION_DEFAULT_SIZE:20}
    max-size: ${APP_PAGINATION_MAX_SIZE:100}
  api-key:
    key-bytes: ${APP_API_KEY_KEY_BYTES:32}
    max-attempts: ${APP_API_KEY_MAX_ATTEMPTS:10}
    prefix: ${APP_API_KEY_PREFIX:LM}
  api-secret:
    secret-bytes: ${APP_API_SECRET_SECRET_BYTES:64}
  filter:
    skip-paths: ${APP_FILTER_SKIP_PATHS:/health,/actuator/health,/actuator/**,/admin/**,/swagger-ui**,/v3/api-docs**,/api-docs**,/error**}
    masking:
      api-key-visible-chars: ${APP_FILTER_MASKING_API_KEY_VISIBLE_CHARS:4}
      recipient-visible-chars: ${APP_FILTER_MASKING_RECIPIENT_VISIBLE_CHARS:3}
      ip-visible-chars: ${APP_FILTER_MASKING_IP_VISIBLE_CHARS:8}
  redis:
    key-prefix:
      admin-rate-limit: ${APP_REDIS_KEY_PREFIX_ADMIN_RATE_LIMIT:admin:ratelimit:}
  openapi:
    info:
      title: ${APP_OPENAPI_INFO_TITLE:Irembo Notifications API}
      version: ${APP_OPENAPI_INFO_VERSION:1.0.0}
      description: ${APP_OPENAPI_INFO_DESCRIPTION:Distributed notification API with sophisticated rate limiting}
      contact:
        name: ${APP_OPENAPI_INFO_CONTACT_NAME:Irembo Engineering}
        email: ${APP_OPENAPI_INFO_CONTACT_EMAIL:engineering@irembo.com}
      license:
        name: ${APP_OPENAPI_INFO_LICENSE_NAME:MIT License}
        url: ${APP_OPENAPI_INFO_LICENSE_URL:https://opensource.org/licenses/MIT}
    server:
      url: ${APP_OPENAPI_SERVER_URL:http://localhost:1310}
      description: ${APP_OPENAPI_SERVER_DESCRIPTION:Development server}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:1015,http://localhost:1315,http://localhost:4200,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

cache:
  type: ${CACHE_TYPE:redis}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true
